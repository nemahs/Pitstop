services:
  frontend:
    build: .
    image: registry.nemahs.org/pitstop:latest
    secrets:
      - source: app.config
        target: /app/.env

    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.services.pitstop.loadbalancer.server.port: 80
        traefik.docker.network: "incursions"
        traefik.http.routers.pitstop.rule: "Host(`pitstop.nemahs.org`)"
        traefik.http.routers.pitstop.tls: "true"
        traefik.http.routers.pitstop.tls.certresolver: "letsencrypt"
        traefik.http.middlewares.redirect.redirectscheme.scheme: "https"
        traefik.http.middlewares.redirect.redirectscheme.permanent: "true"
        traefik.http.routers.pitstop.middlewares: "redirect"

      update_config:
          failure_action: "rollback"

    networks:
      - pitstop
      - incursions

  grafana:
    image: grafana/grafana

    environment:
      GF_SERVER_DOMAIN: "grafana.nemahs.org"

    deploy:
      labels:
        traefik.enable: "true"
        traefik.http.services.grafana.loadbalancer.server.port: 3000
        traefik.docker.network: "incursions"
        traefik.http.routers.grafana.rule: "Host(`grafana.nemahs.org`)"
        traefik.http.routers.grafana.tls: "true"
        traefik.http.routers.grafana.tls.certresolver: "letsencrypt"
        traefik.http.routers.grafana.middlewares: "redirect"
        traefik.http.middlewares.redirect.redirectscheme.scheme: "https"
        traefik.http.middlewares.redirect.redirectscheme.permanent: "true"

      update_config:
          failure_action: "rollback"

    volumes:
      - grafana_data:/var/lib/grafana:rw

    networks:
      - pitstop
      - incursions

  valkey:
    image: valkey/valkey:latest
    ports:
      - "8000:8000"
    volumes:
      - valkey_data:/data
    networks:
      - pitstop

volumes:
  valkey_data:
  grafana_data:

secrets:
  app.config:
    file: ./.env

networks:
  pitstop:
    driver: overlay
  incursions: # TODO: Rename
     external: true
       